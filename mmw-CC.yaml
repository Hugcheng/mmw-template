external-controller: 127.0.0.1:9090
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    - "gspe1-ssl.ls.apple.com"
    - "+.3gppnetwork.org"
    - "+.attwifi.com"
    - "+.vzwwo.com"
    - "+.vodafone.com"
    - "+.ondemandconnectivity.com"

  nameserver:
    - 119.29.29.29
    - 223.5.5.5

  proxy-server-nameserver:
    - 223.5.5.5
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

  nameserver-policy:
    geosite:cn:
      - 119.29.29.29
      - 223.5.5.5
    geosite:private:
      - 119.29.29.29
      - 223.5.5.5
    geosite:geolocation-!cn:
      - https://1.1.1.1/dns-query#Global
      - https://dns.google/dns-query#Global

proxy-groups:
  - name: Chain
    type: select
    proxies:
      - Have a nice Day😊
      - ❤All the best
      - DIRECT

  - name: AI
    type: select
    include-all: true
    filter: "(?i)(at&t|\\batt\\b|verizon|vzw|\\bt-?mobile|\\btmo\\b)"
    proxies:
      - Have a nice Day😊
      - ❤All the best
      - Global
      - DIRECT

  - name: Global
    type: select
    include-all: true
    proxies:
      - Have a nice Day😊
      - ❤All the best
      - DIRECT
      - REJECT

rules:
  - RULE-SET,Lan,DIRECT
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - DOMAIN-KEYWORD,torrent,DIRECT
  - DOMAIN-SUFFIX,m-team.cc,DIRECT
  - RULE-SET,BiliBili,DIRECT
  - RULE-SET,SteamCN,DIRECT

  # Apple Intelligence / Siri ChatGPT / Notification
  - RULE-SET,AppleAI,AI
  - DOMAIN-SUFFIX,push.apple.com,Global

  # Apple 服务自定义分流
